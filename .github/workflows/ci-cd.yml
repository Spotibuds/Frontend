name: Validate local demo
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_IDENTITY_API: http://127.0.0.1:5101
      NEXT_PUBLIC_MUSIC_API: http://127.0.0.1:5102
      NEXT_PUBLIC_USER_API: http://127.0.0.1:5103
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Validate container without publishing
        run: docker build --build-arg NEXT_PUBLIC_IDENTITY_API --build-arg NEXT_PUBLIC_MUSIC_API --build-arg NEXT_PUBLIC_USER_API -t spotibuds-frontend:ci .
